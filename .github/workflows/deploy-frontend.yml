name: Deploy Frontend (SWA)

on:
  push:
    branches: [master]
    paths:
      - 'web-svelte/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy SWA
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-svelte/package-lock.json

      - name: Install deps
        working-directory: web-svelte
        run: npm ci

      - name: Build
        working-directory: web-svelte
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: 'web-svelte/build'
          skip_app_build: true
          skip_api_build: true
