<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />

		<!-- App / PWA metadata -->
		<title>Pocket CPA</title>
		<meta name="description" content="AI-powered personal spending analyzer." />
		<meta name="theme-color" content="#C5F3DF" />
		<link rel="manifest" href="/manifest.webmanifest" />

		<!-- Favicons -->
		<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />

		<!-- iOS home screen icon + standalone app settings -->
		<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Pocket CPA" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
